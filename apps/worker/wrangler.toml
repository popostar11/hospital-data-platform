#:schema node_modules/wrangler/config-schema.json

# ============================================================================
#  Cloudflare Workers 部署配置（公网演示环境）
#
#  部署前需要做两件事（详见 docs/DEPLOY-CLOUDFLARE.md）：
#    1. wrangler d1 create hospital_platform   → 把返回的 database_id 填到下面
#    2. wrangler secret put JWT_SECRET / CRYPTO_KEY / SEED_TOKEN
# ============================================================================

name = "hospital-data-platform"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Workers 与 D1 交互需要 nodejs_compat（提供部分 Node API 兼容层）
compatibility_flags = ["nodejs_compat"]

# 单请求 CPU 上限：免费版固定 10ms，付费版可调。这里用默认值，
# 因此把「生成种子数据」这类重活放到本地脚本做（见 tools/export-d1-seed.mjs）。
[observability]
enabled = true

# ---------------------------------------------------------------- 数据存储
[[d1_databases]]
binding = "DB"
database_name = "hospital_platform"
# ⚠ 替换为 `wrangler d1 create hospital_platform` 返回的真实 id
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ------------------------------------------------------------------ 静态资源
# 两个前端构建产物由 scripts/build-assets.mjs 汇总到 ./public
#   访问路径：/admin/ 与 /screen/
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# ------------------------------------------------------------------ 环境变量
# 仅放非敏感配置；密钥一律用 `wrangler secret put` 写入，不要写进本文件
[vars]
DEMO_MODE = "true"
SCREEN_CACHE_TTL = "5"
SCREEN_TABLE_LIMIT = "20"
DEFAULT_TIMEZONE = "Asia/Shanghai"

# ------------------------------------------------------------------ 本地开发
# `wrangler dev` 会把本地 D1 数据放在 .wrangler/state 下，与线上库互不影响
[dev]
port = 8788
local_protocol = "http"
